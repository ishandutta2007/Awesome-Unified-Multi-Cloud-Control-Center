<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <style>
    /* Background subtle pulsating nebula glow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.12); }
    }
    /* Dynamic floating orbit and badges */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1.5deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1.5deg); }
    }
    /* Flowing dashed data packets */
    @keyframes dashStream {
      to { stroke-dashoffset: -80; }
    }
    /* Orbital nodes */
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(45px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(45px) rotate(-360deg); }
    }

    .nebula-1 { transform-origin: 200px 100px; animation: pulseGlow 8s ease-in-out infinite; }
    .nebula-2 { transform-origin: 1000px 250px; animation: pulseGlow 10s ease-in-out infinite 3s; }
    .float-item-1 { animation: floatSlow 6s ease-in-out infinite; }
    .float-item-2 { animation: floatReverse 7s ease-in-out infinite 1s; }
    .float-item-3 { animation: floatSlow 8s ease-in-out infinite 2s; }
    .stream-line { stroke-dasharray: 6 10; animation: dashStream 3s linear infinite; }
  </style>

  <!-- Deep Background Rect -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Subtle Tech Grid Matrix -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Animated Glowing Nebulas (Strictly in Background) -->
  <circle class="nebula-1" cx="220" cy="120" r="140" fill="#38bdf8" filter="url(#glow-blur)"/>
  <circle class="nebula-2" cx="980" cy="220" r="160" fill="#a855f7" filter="url(#glow-blur)"/>

  <!-- Dynamic Animated Architecture Flow Lines (Background Layers) -->
  <g opacity="0.35" fill="none" stroke-width="2">
    <!-- Curved interconnecting multi-cloud telemetry pipelines -->
    <path class="stream-line" stroke="#38bdf8" d="M 50 180 C 250 80, 400 280, 600 180 C 800 80, 950 280, 1150 180"/>
    <path class="stream-line" stroke="#c084fc" d="M 50 220 C 300 320, 500 80, 700 220 C 900 320, 1050 100, 1150 200"/>
  </g>

  <!-- Floating Dynamic Tech Pills / Badges (Flanking the Sides) -->
  <!-- Left Side Dynamic Floating Elements -->
  <g class="float-item-1" transform="translate(60, 50)">
    <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#38bdf8"/>
    <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">AWS • AZURE • GCP</text>
  </g>

  <g class="float-item-2" transform="translate(40, 260)">
    <rect width="190" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#818cf8"/>
    <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">FinOps &amp; Cost Visibility</text>
  </g>

  <!-- Right Side Dynamic Floating Elements -->
  <g class="float-item-3" transform="translate(960, 55)">
    <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#a855f7"/>
    <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">Kubernetes &amp; VMs</text>
  </g>

  <g class="float-item-1" transform="translate(970, 255)">
    <rect width="175" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="6" fill="#34d399"/>
    <text x="40" y="26" fill="#f8fafc" font-size="13" font-weight="600" letter-spacing="0.5">Unified Control Plane</text>
  </g>

  <!-- Center Decorative Platform Hub Icon -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <!-- Central Hexagonal / Circular Core -->
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="url(#primary-glow)" stroke-width="3"/>
    <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
    <!-- Orbiting Micro Node -->
    <circle cx="24" cy="-18" r="3.5" fill="#c084fc">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Main Title & Subtitle in Foreground (Clean, Crisp, Prominent) -->
  <!-- Top Super-Header Category Pill -->
  <g transform="translate(600, 126)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="5" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.8">CURATED OPEN-SOURCE &amp; SAAS</text>
  </g>

  <!-- Primary Title -->
  <text x="600" y="195" text-anchor="middle" font-size="38" font-weight="800" fill="url(#primary-glow)" letter-spacing="-0.5">
    Unified Multi-Cloud Control Center
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="234" text-anchor="middle" font-size="16.5" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
    Centralized Management • Multi-Cloud Orchestration • FinOps &amp; Governance
  </text>

  <!-- Subtitle Line 2 (Feature tags) -->
  <text x="600" y="264" text-anchor="middle" font-size="13.5" font-weight="400" fill="#94a3b8" letter-spacing="0.4">
    AWS • Microsoft Azure • Google Cloud • Private Hybrid Infrastructure • Kubernetes
  </text>

  <!-- Bottom Accent Status Line -->
  <g transform="translate(600, 312)" text-anchor="middle">
    <rect x="-95" y="-12" width="190" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="-70" cy="0" r="4" fill="#10b981"/>
    <text x="8" y="4" fill="#a7f3d0" font-size="11" font-weight="600" letter-spacing="0.5">PRODUCTION-READY TOOLS</text>
  </g>
</svg>